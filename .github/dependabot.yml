version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/services/api"
      - "/services/worker"
      - "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor","patch"]
  - package-ecosystem: docker
    directories:
      - "/services/api"
      - "/services/worker"
      - "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"      