server {
    listen 8080;
    root /usr/share/nginx/html;

    # health check for Docker / k8s (does not need the api)
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # /api → the api container
    location /api/ {
        proxy_pass http://api:3000;
    }

    # React page; unknown paths → index.html
    location / {
        try_files $uri /index.html;
    }
}